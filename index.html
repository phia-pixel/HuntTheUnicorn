<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunt the Unicorn</title>
    <link rel = "stylesheet" href =  "style.css">
    <link
        rel="icon"
        type="image/x-icon"
        href="assets/images/favicon.ico">
    </head>

<body>
    <div id="intro-overlay">
     <h1 id="intro-text">You have one goal</h1>
     <button id="intro-btn">Continue</button>
   </div>
 
   <div id="tapestry">
     <div id="unicornbase"></div>
   </div>

   <script>
       var step = 1;
       var overlay = document.getElementById("intro-overlay");
       var introText = document.getElementById("intro-text");
       var introBtn = document.getElementById("intro-btn");
     introBtn.addEventListener("click", function() {
        if (step === 1) {
            introText.innerText = "Kill it";
            introBtn.innerText = "Start";
            step = 2;
        } else if (step === 2) {
            overlay.style.display = "none";
        }
    });

    var sprite = document.getElementById("unicornbase");
    var idleImage = "assets/images/unicornbase.PNG";
    var runFrames = [
        "assets/images/unicornrun1.PNG",
        "assets/images/unicornrun2.png",
        "assets/images/unicornrun3.png",
        "assets/images/unicornrun4.png",
        "assets/images/unicornrun5.png"
    ];

    var runSound = new Audio("assets/sound/Horse ISS740.mp3");

    var currentFrame = 0;
    
    var tapestry = document.getElementById("tapestry");

    var spriteX = tapestry.clientWidth / 2;
    var spriteY = tapestry.clientHeight / 2;

    var speed = 50;
    var animationTimer = null;
    var animationSpeed = 100;
    var detectionRadiusX = 250;
    var detectionRadiusY = 220;

    sprite.style.backgroundImage = "url('" + idleImage + "')";

    moveSprite();
    document.onmousemove = function(event) {
        var tapestryRect = tapestry.getBoundingClientRect();
        var mouseX = event.clientX - tapestryRect.left;
        var mouseY = event.clientY - tapestryRect.top;
        var isMoving = false;
        var diffX = spriteX - mouseX;
        var diffY = spriteY - mouseY;
        if (diffX < 120 && diffX > -120) {
            isMoving = true;
            if (diffX > 0) {
            spriteX += speed;
            sprite.style.transform = "scaleX(-1)";
         } else {
            spriteX -= speed;
            sprite.style.transform = "scaleX(1)";
         }
        }

        if (diffY < 100 && diffY > -100) {
           isMoving = true;
           if (diffY > 0) {
            spriteY += speed;
         } else {
            spriteY -= speed;
         }
        }

        keepInBounds();

        if (isMoving) {
            nextRunFrame();
        } else {
            currentFrame = 0;
            
            sprite.style.backgroundImage = 
                "url('" + idleImage + "')";
        }
        
        moveSprite();
    };

    function nextRunFrame() {
        sprite.style.backgroundImage = 
            "url('" + runFrames[currentFrame] + "')";

        currentFrame++;
        if (currentFrame >= runFrames.length) {
            currentFrame = 0;
        }
    }
   
    function moveSprite() {
        sprite.style.left = (spriteX - sprite.offsetWidth / 2) + "px";
        sprite.style.top = (spriteY - sprite.offsetHeight / 2) + "px";
    }

    
    function keepInBounds() {
         var spriteHalfX = sprite.offsetWidth / 2;
         var spriteHalfY = sprite.offsetHeight / 2;

         var minX = spriteHalfX;
         var maxX = tapestry.clientWidth - spriteHalfX;

         var minY = spriteHalfY;
         var maxY = tapestry.clientHeight - spriteHalfY;

         spriteX = Math.max(minX, Math.min(spriteX, maxX));
         spriteY = Math.max(minY, Math.min(spriteY, maxY));

    }

    window.addEventListener("resize", function() {
        keepInBounds();
        moveSprite();
    });

 </script>
</body>
</html>
